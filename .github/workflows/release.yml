name: Build and Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set build version from tag
      id: build_version
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)$') {
          throw "Release tags must look like v1.2.3. Got: $tag"
        }

        $version = $Matches.version
        "APP_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "app_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "app_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

        Write-Host "Setting build version to $version from tag $tag"

        $versionFile = "utils/version.py"
        $versionText = Get-Content $versionFile -Raw -Encoding UTF8
        $versionText = $versionText -replace '(?m)^__version__ = ".*"', "__version__ = `"$version`""
        Set-Content $versionFile $versionText -Encoding UTF8

        foreach ($readme in @("README.md", "README_ZH.md")) {
          if (Test-Path $readme) {
            $readmeText = Get-Content $readme -Raw -Encoding UTF8
            $readmeText = $readmeText -replace 'version-[0-9A-Za-z.+-]+-blue', "version-$version-blue"
            Set-Content $readme $readmeText -Encoding UTF8
          }
        }

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "PlaylistAdministrator" --add-data "core;core" --add-data "gui;gui" --add-data "utils;utils" --collect-all zhconv main.py

    - name: Install Inno Setup
      run: |
        choco install innosetup --no-progress -y

    - name: Build installer
      run: |
        & "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" "/DMyAppVersion=${{ steps.build_version.outputs.app_version }}" "installer\\PlaylistAdministrator.iss"

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        name: Playlist Administrator ${{ steps.build_version.outputs.app_tag }}
        files: installer/dist_installer/PlaylistAdministrator-Setup.exe
      env:
        GITHUB_TOKEN: ${{ github.token }}
