name: Flutter Build & Release

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: true

      - name: Get version from tag
        id: version
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $version = $tag -replace '^v', ''
            if (-not $version) { $version = '2.0.0' }
          } else {
            # Branch push: use version from pubspec.yaml as-is
            $yaml = Get-Content pubspec.yaml | Select-String '^version: (.+)'
            $version = $yaml.Matches.Groups[1].Value
            if (-not $version) { $version = '0.0.0-dev' }
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - run: flutter pub get

      - name: Analyze
        if: github.ref_type != 'tag'
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Sync bridge to assets
        run: |
          Copy-Item -Path "tools\flutter_download_bridge.py" -Destination "assets\tools\flutter_download_bridge.py" -Force
          Copy-Item -Path "tools\download_podcast_srts.py" -Destination "assets\tools\download_podcast_srts.py" -Force
          New-Item -ItemType Directory -Path "assets\tools\rag" -Force | Out-Null
          Copy-Item -Path "rag\*.py" -Destination "assets\tools\rag\" -Force

      - name: Build Windows
        if: github.ref_type == 'tag'
        run: flutter build windows --release --dart-define=APP_VERSION=$env:APP_VERSION

      - name: Install Inno Setup
        if: github.ref_type == 'tag'
        run: choco install innosetup --no-progress -y

      - name: Build installer
        if: github.ref_type == 'tag'
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" "installer\PlaylistAdministrator.iss"

      - name: Upload artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: playlist-admin-Setup
          path: installer\playlist-admin-Setup-*.exe

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: "Playlist Administrator ${{ github.ref_name }}"
          files: installer\playlist-admin-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ github.token }}
