name: Flutter CI

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
      - run: flutter pub get
      - run: flutter analyze
        continue-on-error: true

  build:
    needs: analyze
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - run: flutter pub get

      - name: Build Windows
        run: |
          flutter build windows --release

      - name: Package
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "PlaylistAdministrator.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: PlaylistAdministrator
          path: |
            build/windows/x64/runner/Release/PlaylistAdministrator.exe
            PlaylistAdministrator.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Playlist Administrator ${{ github.ref_name }}"
          files: |
            PlaylistAdministrator.zip
            build/windows/x64/runner/Release/PlaylistAdministrator.exe
        env:
          GITHUB_TOKEN: ${{ github.token }}
