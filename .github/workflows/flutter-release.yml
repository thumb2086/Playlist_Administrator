name: Flutter CI

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: true
      - run: flutter pub get
      - run: flutter analyze || true

  build:
    needs: analyze
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: true

      - run: flutter pub get

      - name: Build Windows
        run: |
          flutter build windows --release

      - name: Verify executable
        run: |
          if (-not (Test-Path build/windows/x64/runner/Release/playlist_administrator.exe)) {
            throw "Executable not found!"
          }
          $size = (Get-Item build/windows/x64/runner/Release/playlist_administrator.exe).Length
          Write-Host "Executable size: $size bytes"
          if ($size -lt 1000000) {
            Write-Host "Warning: Executable is very small ($size bytes)"
          }
          Copy-Item build/windows/x64/runner/Release/playlist_administrator.exe PlaylistAdministrator.exe
          Write-Host "Copied to root successfully"

      - uses: actions/upload-artifact@v4
        with:
          name: PlaylistAdministrator
          path: PlaylistAdministrator.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Playlist Administrator ${{ github.ref_name }}"
          files: PlaylistAdministrator.exe
        env:
          GITHUB_TOKEN: ${{ github.token }}
