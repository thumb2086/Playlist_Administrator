name: Flutter CI

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: true
      - run: flutter pub get
      - run: flutter analyze || true

  build:
    needs: analyze
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: true

      - run: flutter pub get

      - uses: actions/cache@v4
        with:
          path: build/
          key: flutter-build-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'windows/**') }}
          restore-keys: |
            flutter-build-${{ runner.os }}-

      - name: Build Windows
        run: |
          flutter build windows --release

      - name: Copy executable to root
        run: |
          Copy-Item build/windows/x64/runner/Release/playlist_administrator.exe PlaylistAdministrator.exe

      - uses: actions/upload-artifact@v4
        with:
          name: PlaylistAdministrator
          path: PlaylistAdministrator.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Playlist Administrator ${{ github.ref_name }}"
          files: PlaylistAdministrator.exe
        env:
          GITHUB_TOKEN: ${{ github.token }}
