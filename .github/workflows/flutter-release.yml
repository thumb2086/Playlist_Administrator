name: Flutter Build & Release

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: true

      - name: Get version from tag
        id: version
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $version = $tag -replace '^v', ''
            if (-not $version) { $version = '2.0.0' }
          } else {
            # Branch push: use version from pubspec.yaml as-is
            $yaml = Get-Content pubspec.yaml | Select-String '^version: (.+)'
            $version = $yaml.Matches.Groups[1].Value
            if (-not $version) { $version = '0.0.0-dev' }
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sync version to pubspec.yaml
        if: github.ref_type == 'tag'
        run: |
          (Get-Content pubspec.yaml) -replace '^version: .+', "version: $env:APP_VERSION" | Set-Content pubspec.yaml

      - name: Sync version to utils/version.py
        if: github.ref_type == 'tag'
        run: |
          (Get-Content utils/version.py) -replace '(?<=__version__ = ").+(?=")', "$env:APP_VERSION" | Set-Content utils/version.py

      - run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" "installer\PlaylistAdministrator.iss"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlaylistAdministrator-Setup
          path: installer\PlaylistAdministrator-Setup-*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Playlist Administrator ${{ github.ref_name }}"
          files: installer\PlaylistAdministrator-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ github.token }}
