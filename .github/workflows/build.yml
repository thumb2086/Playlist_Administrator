name: Build Standalone Executables

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Ensure bin directory exists
        run: python -c "import os; os.makedirs('bin', exist_ok=True)"

      - name: Build Windows executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --name PlaylistAdministrator --add-binary "bin/*;bin" streamlit_app.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlaylistAdministrator-windows
          path: dist/PlaylistAdministrator.exe

      - name: Attach Windows build to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PlaylistAdministrator.exe
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Ensure bin directory exists
        run: python -c "import os; os.makedirs('bin', exist_ok=True)"

      - name: Build Linux executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --name PlaylistAdministrator --add-binary "bin/*:bin" streamlit_app.py

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlaylistAdministrator-linux
          path: dist/PlaylistAdministrator

      - name: Attach Linux build to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PlaylistAdministrator
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
