name: Build Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Prepare release bundle
        run: |
          mkdir release_bundle
          copy build\windows\x64\runner\Release\playlist_administrator.exe release_bundle\
          xcopy /E /I tools release_bundle\tools\
          copy .env release_bundle\ 2>nul || echo no .env

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: playlist-administrator-windows
          path: release_bundle\

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_bundle\playlist_administrator.exe
            release_bundle\tools\*
          generate_release_notes: true